<style>
:root{--ink:#1C1410;--cream:#FFF6DE;--red:#E3362B;--gold:#FFC21F;--bg:#14241A;--card:#1E3424;--line:#3E6A48;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14241A}}
:root[data-theme="dark"]{--bg:#14241A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(ellipse at 50% -10%,#2E5A38,transparent 60%) no-repeat;color:var(--cream);font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;-webkit-tap-highlight-color:transparent}
button,a,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.app{width:min(100%,980px);margin:0 auto;padding:10px 14px 28px}
.screen{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.screen[hidden],section[hidden]{display:none!important}
h1{margin:6px 0 0;font-weight:400;font-size:clamp(2rem,8vw,3.3rem);line-height:.95;color:var(--gold);text-shadow:0 4px 0 var(--red),0 8px 0 var(--ink)}
.sub{margin:0;font-size:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:min(86vw,300px);min-height:50px;padding:.2em 1em .1em;border-radius:16px;background:var(--red);color:#fff;font-size:1.2rem;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);text-decoration:none}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.soft{background:var(--cream);color:var(--ink);font-size:1.02rem;min-height:44px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{min-height:44px;padding:.15em .9em .05em;border-radius:12px;background:var(--card);border:3px solid var(--line);font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;width:min(86vw,300px);text-align:left;font-size:1rem}
.field input{min-height:50px;padding:0 .7em;border-radius:12px;border:3px solid var(--gold);background:#fff;color:var(--ink);font-family:"Trebuchet MS",sans-serif;font-weight:800;font-size:1.15rem}
.code{font-size:clamp(3rem,16vw,5rem);letter-spacing:.12em;color:var(--gold);text-shadow:0 5px 0 var(--ink);line-height:1}
.note{margin:0;max-width:560px;font-family:"Trebuchet MS",sans-serif;font-weight:700;font-size:.95rem;line-height:1.35;opacity:.92}
.warn{color:#FFB0A0}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.pl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:110px}
.pl canvas{width:clamp(64px,18vw,100px);height:auto;image-rendering:pixelated}.vs .x{font-size:2.2rem;color:var(--gold)}.wait{opacity:.5}
.pcard{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;background:var(--card);border:3px solid var(--line);text-align:left;min-width:150px}
.pcard.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,31,.3)}
.pcard canvas{width:44px;height:auto;image-rendering:pixelated;flex:none}.pcard b{display:block;font-weight:400;font-size:1.05rem;line-height:1.1}.pcard small{display:block;font-family:"Trebuchet MS",sans-serif;font-weight:800;font-size:.85rem;opacity:.9}
#stTx{margin:0;min-height:1.5em;font-size:1.25rem}
#endTitle{font-size:clamp(2rem,9vw,3.4rem)}

.rkapp{width:min(100%,520px);margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;min-height:100vh}
.rkTop{display:flex;align-items:center;gap:8px;width:100%}
.rkTop .btn{min-width:0;min-height:44px;font-size:1rem;padding:.1em .8em 0;flex:none}
.rkTop img{height:clamp(70px,22vw,110px);width:auto;image-rendering:pixelated;margin:0 auto;display:block}
.cats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.cat{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:var(--abaoff) 0 0/100% 100% no-repeat;color:var(--cream);font-family:inherit;font-size:.92rem;padding:4px 2px 8px;min-height:64px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat[aria-pressed="true"]{background-image:var(--abaon);color:var(--ink)}
.ci{width:34px;height:34px;background:var(--cat) 0 0/600% 100% no-repeat;image-rendering:pixelated}
.games{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.gc{min-height:38px;padding:0 12px;border-radius:12px;border:3px solid var(--line);background:var(--card);color:var(--cream);font-family:inherit;font-size:.95rem;cursor:pointer}
.gc[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:#fff3b0}
.rkh{position:relative;z-index:1;margin:2px 0 0;font-size:clamp(1.25rem,5vw,1.7rem);color:var(--gold);text-shadow:0 3px 0 #1C1410;text-align:center}
.rkMain{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.stage{position:relative;z-index:0;width:100%;max-width:420px;margin-top:clamp(76px,22vw,112px)}
.pod{position:relative;width:100%}
.pod>img{width:100%;display:block;image-rendering:pixelated}
.hero{position:absolute;transform:translateX(-50%);width:clamp(62px,21vw,92px)}
.hero canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.hero .crown{position:absolute;left:50%;top:-8%;width:34px;height:34px;transform:translateX(-50%);background:var(--med) -136px 0/204px 34px no-repeat;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.hero.empty{opacity:.28;filter:grayscale(1)}
.plqs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.pq{background:var(--plaq) 0 0/100% 100% no-repeat;min-height:76px;padding:6px 16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center;line-height:1.05;min-width:0}
.pq.p1{background-image:var(--ouro)}
.pq.me{outline:3px solid #fff;outline-offset:-2px;border-radius:14px}
.pq i{width:26px;height:26px;background:var(--med) 0 0/156px 26px no-repeat;image-rendering:pixelated;margin-bottom:1px}
.pq b{font-weight:400;font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pq span{font-family:"Trebuchet MS",sans-serif;font-weight:900;font-size:.8rem}
.fx{position:absolute;pointer-events:none;image-rendering:pixelated}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;width:100%;max-width:440px}
#list li{display:flex;align-items:center;gap:8px;min-height:52px;padding:2px 30px 2px 16px;background:var(--plaq) 0 0/100% 100% no-repeat;color:var(--ink);font-size:1.02rem}
#list li.me{background-image:var(--ouro)}
#list li.empt{background:none;color:var(--cream);justify-content:center;text-align:center;padding:14px 0}
#list .n{flex:none;width:30px;height:30px;background:var(--bola) 0 0/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;color:#FFF6DE;font-size:.85rem;text-shadow:0 1px 0 #000}
#list canvas{flex:none;width:30px;height:38px;image-rendering:pixelated}
#list b{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list span{font-family:"Trebuchet MS",sans-serif;font-weight:900;font-size:.9rem}
.meb{width:100%;max-width:440px;min-height:70px;background:var(--fita) 0 0/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;color:#FFF6DE;font-size:1.05rem;padding:6px 40px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.meb[hidden]{display:none}
#tNote{margin:0;text-align:center;font-family:"Trebuchet MS",sans-serif;font-weight:700;opacity:.85;font-size:.9rem}
@media (orientation:landscape) and (max-height:560px){
  .rkapp{gap:6px;padding-top:6px}.rkh{display:none}
  .rkTop img{height:54px}.rkTop .btn{min-height:40px}
  .cat{min-height:46px;font-size:.78rem;padding:2px 2px 6px}.ci{width:26px;height:26px}
  .gc{min-height:32px;font-size:.85rem;padding:0 10px}
  .stage{max-width:290px;margin-top:58px}.hero{width:58px}.pq{min-height:58px;padding:3px 12px 8px}.pq i{width:20px;height:20px;background-size:120px 20px}.pq b{font-size:.8rem}.pq span{font-size:.7rem}
  #list li{min-height:44px}
}
@media (orientation:landscape) and (min-width:700px){
  .rkapp{width:min(100%,960px)}
  .rkTop{max-width:960px}.rkTop img{height:clamp(56px,16vh,90px)}
  .cats{grid-template-columns:repeat(6,minmax(0,1fr))}
  .rkMain{flex-direction:row;align-items:flex-start;justify-content:center;gap:18px}
  .rkMain>.left{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;align-items:center}
  .rkMain>.right{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  .stage{margin-top:clamp(70px,20vh,100px)}
}
</style>
</head>
