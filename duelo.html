<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duelo da Macacada</title>
<meta name="theme-color" content="#14241A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1410;--cream:#FFF6DE;--red:#E3362B;--gold:#FFC21F;--bg:#14241A;--card:#1E3424;--line:#3E6A48;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14241A}}
:root[data-theme="dark"]{--bg:#14241A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(ellipse at 50% -10%,#2E5A38,transparent 60%) no-repeat;color:var(--cream);font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;-webkit-tap-highlight-color:transparent}
button,a,input{font:inherit;color:inherit}
button{border:0;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.app{width:min(100%,760px);margin:0 auto;padding:12px 14px 30px}
.screen{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.screen[hidden]{display:none}
h1{margin:6px 0 0;font-weight:400;font-size:clamp(2.2rem,9vw,3.6rem);line-height:.95;color:var(--gold);text-shadow:0 4px 0 var(--red),0 8px 0 var(--ink)}
.sub{margin:0;font-size:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:min(86vw,300px);min-height:54px;padding:.2em 1em .1em;border-radius:16px;background:var(--red);color:#fff;font-size:1.35rem;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);text-decoration:none}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.soft{background:var(--cream);color:var(--ink);font-size:1.1rem;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;width:min(86vw,300px);text-align:left;font-size:1rem}
.field input{min-height:50px;padding:0 .7em;border-radius:12px;border:3px solid var(--gold);background:#fff;color:var(--ink);font-family:"Trebuchet MS",sans-serif;font-weight:800;font-size:1.15rem}
.code{font-size:clamp(3rem,16vw,5rem);letter-spacing:.12em;color:var(--gold);text-shadow:0 5px 0 var(--ink);line-height:1}
.note{margin:0;max-width:520px;font-family:"Trebuchet MS",sans-serif;font-weight:700;font-size:.95rem;line-height:1.35;opacity:.85}
.warn{color:#FFB0A0}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.pl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:110px}
.pl canvas{width:clamp(64px,18vw,100px);height:auto;image-rendering:pixelated}
.pl b{font-weight:400;font-size:1.15rem}
.vs .x{font-size:2.2rem;color:var(--gold)}
.wait{opacity:.5}
/* jogo */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%}
.ps{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;background:var(--card);border:3px solid var(--line);min-width:0}
.ps.r{flex-direction:row-reverse;text-align:right}
.ps canvas{width:44px;height:auto;image-rendering:pixelated;flex:none}
.ps div{min-width:0}
.ps b{display:block;font-weight:400;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps span{display:block;font-size:1.5rem;color:var(--gold);line-height:1}
.ps.ok{border-color:#63D66B}.ps.bad{border-color:#FF6A55}
.round{font-size:1rem;opacity:.85}
.cat{display:inline-flex;align-items:center;gap:8px;padding:.3em 1em .2em;border-radius:999px;border:3px solid var(--ink);font-size:1.25rem;box-shadow:0 4px 0 var(--ink)}
.cat.spin{animation:spin .12s linear infinite}
@keyframes spin{50%{transform:scale(1.08)}}
.q{width:100%;padding:16px;border-radius:18px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);font-family:"Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.3;min-height:4.2em;display:flex;align-items:center;justify-content:center}
.timer{width:100%;height:12px;border-radius:7px;background:#0E1A12;border:2px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#63D66B,#FFE27A)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.op{position:relative;min-height:64px;padding:8px 10px;border-radius:16px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-family:"Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(.98rem,3.8vw,1.15rem);line-height:1.2;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.op:nth-child(1){background:#2672E0}.op:nth-child(2){background:#E3362B}.op:nth-child(3){background:#2FA64A}.op:nth-child(4){background:#E8A417}
.op:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.op[disabled]{cursor:default}
.op.pick{outline:5px solid #fff;outline-offset:-9px}
.op.dim{opacity:.35}
.op.right{background:#2FA64A!important;opacity:1;animation:pop .4s}
.op.wrong{background:#6A2A2A!important;opacity:1}
@keyframes pop{50%{transform:scale(1.06)}}
.who{position:absolute;top:-14px;display:flex;gap:2px}
.who.l{left:-6px}.who.r{right:-6px}
.who canvas{width:34px;height:auto;image-rendering:pixelated}
.res{min-height:1.6em;font-size:1.3rem}
.big{font-size:clamp(2.4rem,11vw,4rem);color:var(--gold);text-shadow:0 5px 0 var(--ink);line-height:1}
@media (orientation:landscape) and (max-height:520px){.app{width:min(100%,980px);padding-top:6px}#game{display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:"hud hud" "cat cat" "q opts" "tm opts" "res res";gap:8px 14px}.hud{grid-area:hud}#catBox{grid-area:cat}.q{grid-area:q;min-height:0;height:100%;font-size:1.15rem;padding:10px}.timer{grid-area:tm}.opts{grid-area:opts;grid-template-columns:1fr;gap:7px}.op{min-height:46px}.res{grid-area:res}h1{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){.cat.spin,.op.right{animation:none}}
</style>
</head>
<body>
<div id="mcLoad" aria-live="polite" style="position:fixed;inset:0;z-index:999;background:#14241A;color:#FFF6DE;font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s">
<div style="font-size:clamp(1.6rem,6vw,2.4rem);color:#FFC21F;text-shadow:0 3px 0 #E3362B,0 6px 0 #1C1410">Carregando<span id="mcDots">...</span></div>
<div style="width:min(70vw,320px);height:16px;border-radius:9px;background:#0E1A12;border:2px solid #3E6A48;overflow:hidden"><i id="mcBar" style="display:block;height:100%;width:5%;background:linear-gradient(90deg,#F2B81E,#FFE27A);transition:width .3s"></i></div>

</div>

<div class="app">
  <section class="screen" id="menu">
    <h1>Duelo da<br>Macacada</h1>
    <p class="sub">Perguntas ao vivo contra um amigo!</p>
    <div id="me"></div>
    <label class="field">Seu apelido<input id="nick" maxlength="10" autocomplete="off" placeholder="Ex.: Macaquinho"></label>
    <button class="btn" id="mkRoom" type="button">⚔️ Criar sala</button>
    <button class="btn gold" id="goJoin" type="button">🔑 Entrar com código</button>
    <button class="btn soft" id="bot" type="button">🤖 Treinar contra o Macaco-Robô</button>
    <p class="note" id="onlineNote"></p>
    <a class="btn soft" id="hubLink" href="index.html" hidden>◀ App da Macacada</a>
  </section>

  <section class="screen" id="join" hidden>
    <h1 style="font-size:clamp(2rem,8vw,3rem)">Entrar na sala</h1>
    <label class="field">Código da sala<input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.6rem"></label>
    <button class="btn" id="doJoin" type="button">ENTRAR</button>
    <button class="btn soft" id="joinBack" type="button">Voltar</button>
    <p class="note warn" id="joinMsg" role="status"></p>
  </section>

  <section class="screen" id="lobby" hidden>
    <p class="sub">Código da sala</p>
    <div class="code" id="codeShow">----</div>
    <p class="note">Mostre este código para o seu amigo. Ele toca em <b>Entrar com código</b> e digita.</p>
    <div class="vs"><div class="pl" id="lp0"><canvas width="72" height="96"></canvas><b></b></div><span class="x">VS</span><div class="pl wait" id="lp1"><canvas width="72" height="96"></canvas><b>Esperando...</b></div></div>
    <p class="note" id="lobbyMsg" role="status"></p>
    <button class="btn soft" id="lobbyBack" type="button">Sair da sala</button>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud"><div class="ps" id="ps0"><canvas width="72" height="96"></canvas><div><b></b><span>0</span></div></div><div class="round" id="roundTx">1/8</div><div class="ps r" id="ps1"><canvas width="72" height="96"></canvas><div><b></b><span>0</span></div></div></div>
    <div id="catBox"><span class="cat" id="cat">💡 Tema</span></div>
    <div class="q" id="qTx" aria-live="polite"></div>
    <div class="timer"><i id="tm"></i></div>
    <div class="opts" id="opts"></div>
    <div class="res" id="resTx" role="status"></div>
  </section>

  <section class="screen" id="end" hidden>
    <h1 id="endTitle" style="font-size:clamp(2.2rem,9vw,3.4rem)">VITÓRIA!</h1>
    <div class="vs"><div class="pl" id="ep0"><canvas width="72" height="96"></canvas><b></b><span class="big">0</span></div><span class="x">×</span><div class="pl" id="ep1"><canvas width="72" height="96"></canvas><b></b><span class="big">0</span></div></div>
    <p class="note" id="endInfo"></p>
    <button class="btn" id="again" type="button">REVANCHE</button>
    <button class="btn soft" id="endMenu" type="button">Menu</button>
  </section>
</div>

<script>
/* Macacada: personagens, carteira de bananas e personalização (compartilhado por todos os jogos) */
var MAC=(function(){

$("goJoin").addEventListener("click",function(){au();$("joinMsg").textContent="";show("join");$("codeIn").focus()});
$("joinBack").addEventListener("click",function(){show("menu")});
$("codeIn").addEventListener("keydown",function(e){if(e.key==="Enter")$("doJoin").click()});
$("doJoin").addEventListener("click",function(){var c=$("codeIn").value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){$("joinMsg").textContent="O código tem 4 letras.";return}room=c;startRoom(false)});
$("lobbyBack").addEventListener("click",function(){leave();show("menu")});
$("bot").addEventListener("click",function(){au();leave();isBot=true;isHost=true;ME=meObj();
  var heroes=MAC.HEROES.filter(function(h){return h[0]!==ME.hero});var bh=heroes[Math.floor(Math.random()*heroes.length)][0];
  players=[ME,{id:"robo",name:"Macaco-Robô",hero:bh,hat:"cartola",glasses:"escuros",scarf:"preto",bot:1}];hostStart()});
$("endMenu").addEventListener("click",function(){leave();show("menu")});
$("again").addEventListener("click",function(){if(isBot){$("bot").click();return}if(isHost&&net&&players.length===2)hostStart();else{$("endInfo").textContent="Esperando quem criou a sala começar a revanche...";if(net)net.send({t:"rematch"})}});
/* sala */
function startRoom(host){leave();ME=meObj();isHost=host;players=[];$("codeShow").textContent=room;$("lobbyMsg").textContent=host?"Esperando o amigo entrar...":"Entrando...";
  drawP($("lp0").querySelector("canvas"),ME);$("lp0").querySelector("b").textContent=ME.name;$("lp1").classList.add("wait");$("lp1").querySelector("b").textContent="Esperando...";$("lp1").querySelector("canvas").getContext("2d").clearRect(0,0,72,96);
  show("lobby");
  net=new Net(room,Object.assign({host:host},ME),onMsg,function(pp,err){
    if(err){$("lobbyMsg").textContent="Não deu para conectar. Confira a internet e tente de novo.";return}
    var list=Object.keys(pp).map(function(k){return pp[k]});
    var other=list.filter(function(p){return p.id!==ME.id});
    if(phase==="lobby"){
      if(!host&&!other.some(function(p){return p.host})){$("lobbyMsg").textContent="Procurando a sala "+room+"... Confira se o código está certo.";}
      if(other.length){var o=other[0];$("lp1").classList.remove("wait");drawP($("lp1").querySelector("canvas"),o);$("lp1").querySelector("b").textContent=o.name}
      if(other.length>1&&!host){$("lobbyMsg").textContent="Essa sala já está cheia.";return}
      if(host&&other.length>=1&&!set){players=[ME,other[0]];$("lobbyMsg").textContent="Começando!";setTimeout(function(){if(phase==="lobby")hostStart()},1200)}
      else if(!host&&other.length)$("lobbyMsg").textContent="Esperando o jogo começar...";
    }else if(phase==="game"&&players.length===2){var opp=players[1].id===ME.id?players[0]:players[1];if(!pp[opp.id]){$("resTx").textContent=opp.name+" saiu do jogo.";finish(true)}}
  });
}
function onMsg(m){
  if(m.t==="start"){if(isHost)return;players=m.players;set=null;scores={};rightCount={};players.forEach(function(p){scores[p.id]=0;rightCount[p.id]=0});setupHud();show("game")}
  else if(m.t==="round"){if(isHost)return;playRound(m)}
  else if(m.t==="ans"){if(isHost)hostAnswer(m.id,m.c,m.ms)}
  else if(m.t==="reveal"){if(isHost)return;reveal(m)}
  else if(m.t==="end"){if(isHost)return;scores=m.scores;rightCount=m.right;finish(false)}
  else if(m.t==="rematch"){if(isHost&&phase==="end"&&players.length===2)hostStart()}
}
/* anfitrião */
function hostStart(){set=makeSet(Math.floor(Math.random()*1e9));ri=-1;scores={};rightCount={};players.forEach(function(p){scores[p.id]=0;rightCount[p.id]=0});
  if(net)net.send({t:"start",players:players});setupHud();show("game");setTimeout(hostNext,600)}
function hostNext(){ri++;if(ri>=ROUNDS){if(net)net.send({t:"end",scores:scores,right:rightCount});finish(false);return}
  answers={};var s=set[ri],m={t:"round",i:ri,c:s.c,q:s.q,o:s.o};if(net)net.send(m);playRound(m);
  clearTimeout(timer);timer=setTimeout(hostReveal,(TIME+2.2)*1000);
  if(isBot){var p=players[1],acc=ri<3?.75:ri<6?.6:.5;clearTimeout(botT);botT=setTimeout(function(){var c=Math.random()<acc?s.k:Math.floor(Math.random()*4);hostAnswer(p.id,c,0)},(2.4+Math.random()*8)*1000+1400)}}
function hostAnswer(id,c,ms){if(answers[id]||ri<0)return;answers[id]={c:c,ms:Date.now()-tStart};if(Object.keys(answers).length>=players.length){clearTimeout(timer);timer=setTimeout(hostReveal,500)}}
function hostReveal(){var s=set[ri],out={};players.forEach(function(p){var a=answers[p.id],ok=a&&a.c===s.k,pts=ok?100+Math.max(0,Math.round(50*(1-Math.min(1,(a.ms-1400)/(TIME*1000))))):0;scores[p.id]+=pts;if(ok)rightCount[p.id]++;out[p.id]={c:a?a.c:-1,pts:pts}});
  var m={t:"reveal",i:ri,k:s.k,a:out,scores:scores};if(net)net.send(m);reveal(m);clearTimeout(revealT);revealT=setTimeout(hostNext,3400)}
/* jogo */
function setupHud(){players.forEach(function(p,i){var el=$("ps"+i);drawP(el.querySelector("canvas"),p);el.querySelector("b").textContent=p.id===ME.id?p.name+" (você)":p.name;el.querySelector("span").textContent="0";el.className="ps"+(i?" r":"")})}
function playRound(m){ri=m.i;myPick=-1;show("game");$("roundTx").textContent="Rodada "+(m.i+1)+"/"+ROUNDS;$("resTx").textContent="";players.forEach(function(p,i){$("ps"+i).className="ps"+(i?" r":"")});
  var cat=$("cat"),k=0,spin=setInterval(function(){var t=THEMES[k++%THEMES.length];cat.textContent=t[1]+" "+t[0];cat.style.background=t[2];SFX.tick()},90);cat.classList.add("spin");
  $("qTx").textContent="Sorteando o tema...";$("opts").innerHTML="";$("tm").style.transition="none";$("tm").style.width="100%";
  setTimeout(function(){clearInterval(spin);cat.classList.remove("spin");var t=THEMES[m.c];cat.textContent=t[1]+" "+t[0];cat.style.background=t[2];SFX.go();
    $("qTx").textContent=m.q;var box=$("opts");box.innerHTML="";
    m.o.forEach(function(o,i){var b=document.createElement("button");b.type="button";b.className="op";b.textContent=o;b.addEventListener("click",function(){pick(i)});box.appendChild(b)});
    tStart=Date.now();void $("tm").offsetWidth;$("tm").style.transition="width "+TIME+"s linear";$("tm").style.width="0%";
  },1400);
}
function pick(i){if(myPick>=0||phase!=="game")return;myPick=i;au();Array.prototype.forEach.call($("opts").children,function(b,j){b.disabled=true;if(j===i)b.classList.add("pick");else b.classList.add("dim")});
  $("resTx").textContent="Resposta enviada! Esperando...";if(isHost)hostAnswer(ME.id,i,0);else if(net)net.send({t:"ans",id:ME.id,c:i,ms:Date.now()-tStart})}
function reveal(m){scores=m.scores;var bs=$("opts").children;$("tm").style.transition="none";
  Array.prototype.forEach.call(bs,function(b,j){b.disabled=true;b.classList.remove("dim","pick");if(j===m.k)b.classList.add("right");else b.classList.add("wrong");b.querySelectorAll(".who").forEach(function(w){w.remove()})});
  players.forEach(function(p,i){var a=m.a[p.id];$("ps"+i).querySelector("span").textContent=scores[p.id]||0;$("ps"+i).className="ps"+(i?" r":"")+(a&&a.pts?" ok":" bad");
    if(a&&a.c>=0&&bs[a.c]){var w=document.createElement("span");w.className="who "+(i?"r":"l");var cv=document.createElement("canvas");cv.width=72;cv.height=96;w.appendChild(cv);bs[a.c].appendChild(w);drawP(cv,p,a.pts?0:4)}});
  var mine=m.a[ME.id];if(mine&&mine.pts){SFX.right();$("resTx").textContent="Acertou! +"+mine.pts}else{SFX.wrong();$("resTx").textContent=mine&&mine.c>=0?"Errou! A certa era: "+bs[m.k].firstChild.textContent:"O tempo acabou!"}
}
function finish(left){clearTimeout(timer);clearTimeout(botT);clearTimeout(revealT);
  var a=players[0],b=players[1];if(!a||!b){show("menu");return}
  var sa=scores[a.id]||0,sb=scores[b.id]||0,mine=ME.id===a.id?sa:sb,their=ME.id===a.id?sb:sa,win=mine>their,draw=mine===their;
  $("endTitle").textContent=left?"O AMIGO SAIU":win?"VITÓRIA!":draw?"EMPATE!":"QUASE!";
  [a,b].forEach(function(p,i){var el=$("ep"+i);drawP(el.querySelector("canvas"),p,(i===0?sa>=sb:sb>=sa)?0:4);el.querySelector("b").textContent=p.name;el.querySelector(".big").textContent=scores[p.id]||0});
  var ac=rightCount[ME.id]||0,ban=ac*5+(win?20:draw?10:0),w=MAC.addBananas(ban);
  $("endInfo").textContent="Você acertou "+ac+" de "+ROUNDS+" · +"+ban+" 🍌 na carteira (agora "+w.b+")";
  if(win||draw)SFX.win();show("end");
}
window.__duelo={get phase(){return phase},pick:pick,get set(){return set},get ri(){return ri},opts:options,makeSet:makeSet};
})();
</script>
